[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartdistserve"
version = "0.1.0"
description = "Reproducible synthetic discrete-event study of disaggregated LLM scheduling"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib==3.10.8"]

[project.scripts]
smartdistserve = "smartdistserve.cli:main"

[tool.setuptools.packages.find]
include = ["smartdistserve*"]
